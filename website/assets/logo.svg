  <title>rulemason</title>
  <style>
    .fr { opacity: 0; }
    .fr.on { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .fr {
        animation-name: rm-cycle;
        animation-duration: 1.8s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .fr.a { animation-delay: 0s; }
      .fr.b { animation-delay: 0.6s; }
      .fr.c { animation-delay: 1.2s; }
    }
    @keyframes rm-cycle {
      0%, 33.333% { opacity: 1; }
      33.334%, 100% { opacity: 0; }
    }
  </style>
