# 推送 v* tag 时发布到 PyPI：先跑 ruff 与测试、核对 tag 与包版本，再构建并经 Trusted Publishing 上传（不用 token）
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check .
      - run: uv run pytest
      - name: 核对 tag 与包版本
        run: |
          version=$(uv run python -c "import rulemason; print(rulemason.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME 与包版本 $version 不一致，不发布" >&2
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi        # PyPI 上登记的 Trusted Publisher 只认这个环境
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
