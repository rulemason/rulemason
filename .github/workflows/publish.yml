# 推送 v* tag 时发布到 PyPI：先跑 ruff 与测试、核对 tag 与包版本，再构建并经 Trusted Publishing 上传（不用 token）；上传成功后建 GitHub Release
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check .
      - run: uv run pytest
      - name: 核对 tag 与包版本
        run: |
          version=$(uv run python -c "import rulemason; print(rulemason.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME 与包版本 $version 不一致，不发布" >&2
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi        # PyPI 上登记的 Trusted Publisher 只认这个环境
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish             # PyPI 上传成功后才建，避免留下对不上 PyPI 的 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # 要找上一个 tag 与之间的提交
          persist-credentials: false
      - name: 建 Release（已有则跳过）
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG 已有 Release，跳过"
            exit 0
          fi
          python3 scripts/release_notes.py "$TAG" > release-notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md --latest
